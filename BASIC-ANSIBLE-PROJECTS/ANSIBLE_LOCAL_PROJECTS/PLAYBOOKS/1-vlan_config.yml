- name: VLAN Configuration
  hosts: switches
  gather_facts: no

  tasks:
    - name: Generate VLAN and access port config
      copy:
        content: |
          vlan {{ vlan_id }}
           name {{ vlan_name }}

          interface {{ access_port }}
           switchport mode access
           switchport access vlan {{ vlan_id }}
           no shutdown
        dest: "./configs/{{ inventory_hostname }}_vlan.cfg"
