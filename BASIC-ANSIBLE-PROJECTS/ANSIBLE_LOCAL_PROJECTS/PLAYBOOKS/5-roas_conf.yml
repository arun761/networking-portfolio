- name: this is ansible playbook
  hosts: routers
  gather_facts: no

  vars:
    trunk_interface: "g0/0"
    vlans:
      - {id: 10, gateway: "192.168.10.1"}
      - {id: 20, gateway: "192.168.20.1"}
      - {id: 30, gateway: "192.168.30.1"}

  tasks:
    - name: this is roas configuration
      copy:
        content: |
          {% for vlan in vlans %}
          interface {{trunk_interface}}.{{vlan.id}}
           encapsulation dot1q {{vlan.id}}
           no shutdown
          {% endfor %}
        dest: "./configs/{{inventory_hostname}}_roas.cfg"

